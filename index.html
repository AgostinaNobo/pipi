<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Una carta para vos 💌</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 20% 15%, rgba(255,255,255,.8), transparent 28%),
        radial-gradient(circle at 80% 85%, rgba(255,235,230,.9), transparent 30%),
        linear-gradient(135deg, #f8eee7, #f3dfdb);
      font-family: Georgia, "Times New Roman", serif;
      color: #5b3a38;
    }

    .page {
      width: min(92vw, 900px);
      padding: 34px 16px 44px;
      text-align: center;
    }

    .hint {
      margin: 0 0 28px;
      font-size: clamp(18px, 2.7vw, 27px);
      letter-spacing: .02em;
      transition: opacity .5s ease;
    }

    .envelope-wrap {
      width: min(78vw, 430px);
      aspect-ratio: 1.45 / 1;
      margin: 0 auto;
      position: relative;
      cursor: pointer;
      perspective: 1200px;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    .envelope {
      position: absolute;
      inset: 0;
      filter: drop-shadow(0 18px 24px rgba(92, 55, 51, .20));
    }

    .back {
      position: absolute;
      inset: 0;
      background: #ead0c4;
      border-radius: 10px;
      overflow: hidden;
    }

    .back::before,
    .back::after {
      content: "";
      position: absolute;
      bottom: 0;
      width: 71%;
      height: 100%;
      background: #e5c4b7;
    }

    .back::before {
      left: 0;
      clip-path: polygon(0 0, 100% 55%, 0 100%);
    }

    .back::after {
      right: 0;
      clip-path: polygon(100% 0, 0 55%, 100% 100%);
    }

    .front {
      position: absolute;
      inset: 0;
      background: #efd7cc;
      clip-path: polygon(0 42%, 50% 75%, 100% 42%, 100% 100%, 0 100%);
      border-radius: 0 0 10px 10px;
      z-index: 4;
    }

    .flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 62%;
      background: #f0d9cf;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      transform-origin: top;
      transform: rotateX(0deg);
      transition: transform .8s cubic-bezier(.2,.75,.2,1);
      z-index: 6;
      backface-visibility: hidden;
    }

    .seal {
      position: absolute;
      left: 50%;
      top: 45%;
      transform: translate(-50%, -50%);
      z-index: 7;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: #9d4d55;
      color: #fff8f4;
      display: grid;
      place-items: center;
      font-size: 26px;
      box-shadow: 0 4px 12px rgba(80,30,35,.25);
      transition: opacity .25s ease .05s, transform .35s ease;
      user-select: none;
    }

    .letter-preview {
      position: absolute;
      left: 8%;
      right: 8%;
      bottom: 8%;
      height: 78%;
      border-radius: 7px 7px 3px 3px;
      background: #fffaf2;
      z-index: 2;
      transform: translateY(18%);
      transition: transform .85s cubic-bezier(.2,.8,.2,1) .22s;
      box-shadow: 0 8px 18px rgba(70,45,40,.15);
      overflow: hidden;
    }

    .letter-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      opacity: .75;
      filter: saturate(.9);
    }

    .envelope-wrap.open .flap {
      transform: rotateX(180deg);
      z-index: 1;
    }

    .envelope-wrap.open .seal {
      opacity: 0;
      transform: translate(-50%, -65%) scale(.8);
      pointer-events: none;
    }

    .envelope-wrap.open .letter-preview {
      transform: translateY(-43%);
      z-index: 5;
    }

    .envelope-wrap.open {
      cursor: default;
    }

    .full-letter {
      position: fixed;
      inset: 0;
      z-index: 30;
      padding: 18px;
      display: grid;
      place-items: center;
      background: rgba(38, 24, 24, .82);
      opacity: 0;
      visibility: hidden;
      transition: opacity .45s ease, visibility .45s ease;
      overflow: auto;
    }

    .full-letter.show {
      opacity: 1;
      visibility: visible;
    }

    .full-letter img {
      display: block;
      max-width: min(1400px, 96vw);
      width: auto;
      height: auto;
      max-height: none;
      border-radius: 4px;
      box-shadow: 0 22px 60px rgba(0,0,0,.38);
    }

    .close {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 31;
      width: 46px;
      height: 46px;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,.92);
      color: #5b3a38;
      font-size: 28px;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,.18);
    }

    .close:focus-visible,
    .envelope-wrap:focus-visible {
      outline: 3px solid #9d4d55;
      outline-offset: 5px;
    }

    @media (max-width: 540px) {
      .page { padding-top: 24px; }
      .envelope-wrap { width: min(88vw, 390px); }
      .full-letter { padding: 56px 8px 18px; }
      .full-letter img { max-width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .flap, .seal, .letter-preview, .full-letter { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <p class="hint" id="hint">Tengo una carta para vos 💌<br><small>Tocá el sobre para abrirla</small></p>

    <div class="envelope-wrap" id="envelopeWrap" role="button" tabindex="0" aria-label="Abrir carta">
      <div class="envelope" aria-hidden="true">
        <div class="back"></div>

        <div class="letter-preview">
          <img src="carta.jpg" alt="" />
        </div>

        <div class="front"></div>
        <div class="flap"></div>
        <div class="seal">♥</div>
      </div>
    </div>
  </main>

  <section class="full-letter" id="fullLetter" aria-hidden="true">
    <button class="close" id="closeBtn" type="button" aria-label="Cerrar carta">×</button>
    <img src="carta.jpg" alt="Carta" />
  </section>

  <script>
    const envelope = document.getElementById("envelopeWrap");
    const fullLetter = document.getElementById("fullLetter");
    const closeBtn = document.getElementById("closeBtn");
    const hint = document.getElementById("hint");
    let opened = false;

    function openLetter() {
      if (opened) return;
      opened = true;
      envelope.classList.add("open");
      envelope.setAttribute("aria-label", "Carta abierta");
      hint.style.opacity = "0";

      setTimeout(() => {
        fullLetter.classList.add("show");
        fullLetter.setAttribute("aria-hidden", "false");
        closeBtn.focus();
      }, 1050);
    }

    function closeLetter() {
      fullLetter.classList.remove("show");
      fullLetter.setAttribute("aria-hidden", "true");
    }

    envelope.addEventListener("click", openLetter);
    envelope.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        openLetter();
      }
    });

    closeBtn.addEventListener("click", closeLetter);

    fullLetter.addEventListener("click", (e) => {
      if (e.target === fullLetter) closeLetter();
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && fullLetter.classList.contains("show")) {
        closeLetter();
      }
    });
  </script>
</body>
</html>
